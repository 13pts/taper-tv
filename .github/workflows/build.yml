name: Build APK

on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk taper-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taper-tv-apk
          path: taper-tv.apk

      # Two rolling releases. "latest" is built from main and is what everyone installs.
      # "beta" is built from the beta branch and is marked as a prerelease, so it never
      # becomes "latest"; only TVs with Beta builds switched on in the app will see it.
      - name: Publish rolling release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG=latest
            TITLE="Taper TV (build ${{ github.run_number }})"
            NOTES="Latest build from main, commit ${{ github.sha }}."
            FLAGS="--latest"
          else
            TAG=beta
            TITLE="TaperTV beta (build ${{ github.run_number }})"
            NOTES="Preview build from the beta branch, commit ${{ github.sha }}. Not for general use."
            FLAGS="--prerelease --latest=false"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" taper-tv.apk --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}" $FLAGS
