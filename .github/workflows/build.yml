name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk taper-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taper-tv-apk
          path: taper-tv.apk

      # On main, keep one rolling "latest" release so the TV always pulls the same link.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taper-tv.apk \
            --title "Taper TV (build ${{ github.run_number }})" \
            --notes "Latest build from main, commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
